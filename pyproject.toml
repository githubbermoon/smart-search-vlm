[project]
name = "smart-stack"
version = "0.1.0"
description = "Privacy-first local multimodal search for personal images and documents on macOS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lancedb",
    "mlx-vlm",
    "open-clip-torch",
    "pillow",
    "pyobjc-framework-Vision",
    "rapidfuzz",
    "sentence-transformers",
    "sqlite-utils",
    "watchdog",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Start with correctness checks that can be enforced without a repository-wide
# style rewrite. Broader rules can be enabled incrementally.
select = ["E9", "F63", "F7", "F82"]
